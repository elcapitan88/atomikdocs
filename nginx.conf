# Serves the Docusaurus build on Fly. Replaces `docusaurus serve` (Node) so a
# cold-started machine is accepting requests in milliseconds — the old Node boot
# window returned 503s for the asset burst of the first page load after idle.
server {
    listen 8080;
    listen [::]:8080;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;
    gzip_min_length 1024;

    error_page 404 /404.html;

    # Content-hashed bundles: cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # trailingSlash:false build → routes are emitted as `intro.html`,
    # `blog.html`, `blog/<slug>.html`; map extensionless URLs onto them.
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }
}
