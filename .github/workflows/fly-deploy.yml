name: Fly Deploy (docs)

# Deploys atomik-docs to Fly.io on every push to main, in parallel with
# Railway. Requires repo secret FLY_API_TOKEN:
#   fly tokens create deploy -a atomik-docs
# then add it under GitHub repo Settings → Secrets and variables → Actions.

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy docs to Fly
    runs-on: ubuntu-latest
    concurrency: deploy-atomik-docs
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
